server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web / SPA routing support.
    # Direct navigation to routes such as /admin-handoff, /home, /memberships, etc.
    # must return index.html so GoRouter can handle the route client-side.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep static assets cacheable while still allowing app shell updates.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
